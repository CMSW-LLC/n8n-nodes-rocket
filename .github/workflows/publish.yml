# Publishes this n8n community node package to npm on every version tag push.
# See: https://docs.n8n.io/integrations/community-nodes/build-community-nodes/
#
# PRIMEIRA PUBLICAÇÃO (pacote ainda não existe no npm):
#   Trusted Publisher NÃO funciona — configure obrigatoriamente o secret NPM_TOKEN.
#   Depois que o pacote existir no npm, você pode adicionar Trusted Publisher e remover o token.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN ausente::O secret NPM_TOKEN não está configurado neste repositório. Com 0 pacotes no npm, Trusted Publisher não existe — crie um token em npmjs.com (Access Tokens → Granular, publish em n8n-nodes-rocket) e adicione em GitHub → Settings → Secrets and variables → Actions → NPM_TOKEN."
            exit 1
          fi
          echo "NPM_TOKEN presente (comprimento: ${#NPM_TOKEN} caracteres)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CMSW_API_KEY: ${{ secrets.CMSW_API_KEY }}
