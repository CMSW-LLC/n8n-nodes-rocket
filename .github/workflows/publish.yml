# Publishes this n8n community node package to npm on every version tag push.
#
# NPM_TOKEN deve estar em: Settings → Secrets and variables → Actions → Repository secrets
# Nome exato: NPM_TOKEN
#
# Se o secret estiver na ORGANIZAÇÃO CMSW-LLC: Organization settings → Secrets →
#   NPM_TOKEN → Repository access → incluir "n8n-nodes-rocket"
#
# Se estiver em um GitHub Environment: descomente a linha "environment:" abaixo e
#   use o mesmo nome do environment onde o secret foi criado.
#
# NÃO use "Variables" (vars) para o token — só "Secrets".

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Descomente se NPM_TOKEN estiver em Settings → Environments → <nome>:
    # environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Diagnose GitHub context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          echo "actor=${{ github.actor }}"
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            echo "::warning::Este workflow roda em um FORK. Secrets do repositório CMSW-LLC/n8n-nodes-rocket não são repassados para forks."
          fi

      - uses: actions/checkout@v4

      - name: Resolve NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN vazio no runner::O GitHub não injetou secrets.NPM_TOKEN neste job."
            echo ""
            echo "O secret pode existir na interface, mas o workflow não o recebe. Verifique:"
            echo "  1. Repositório correto: deve ser CMSW-LLC/n8n-nodes-rocket (tag push neste repo, não só fork local)"
            echo "  2. Aba correta: Secrets and variables → Actions → Repository secrets (NÃO Variables, NÃO Dependabot)"
            echo "  3. Nome exato do secret: NPM_TOKEN (maiúsculas)"
            echo "  4. Secret da organização: Org CMSW-LLC → Settings → Secrets → NPM_TOKEN → Repository access → marcar n8n-nodes-rocket"
            echo "  5. Secret em Environment: descomente 'environment: ...' no topo deste arquivo publish.yml"
            echo "  6. Fork: adicione NPM_TOKEN também nos secrets do fork ou publique tags só no repo oficial"
            exit 1
          fi
          echo "NPM_TOKEN recebido pelo runner (${#NPM_TOKEN} caracteres)"
          echo "NPM_TOKEN=$NPM_TOKEN" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          CMSW_API_KEY: ${{ secrets.CMSW_API_KEY }}
